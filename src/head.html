<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Variable Compensation & Sales PEX Simulator</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com/3.4.17"
    integrity="sha384-igm5BeiBt36UU4gqwWS7imYmelpTsZlQ45FZf+XBn9MuJbn4nQr7yx1yFydocC/K"
    crossorigin="anonymous"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js"
    integrity="sha384-XcdcwHqIPULERb2yDEM4R0XaQKU3YnDsrTmjACBZyfdVVqjh6xQ4/DCMd7XLcA6Y"
    crossorigin="anonymous"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@1.49.0/dist/umd/lucide.min.js"
    integrity="sha384-7mWwAGEOOlxvEBR+Mpy0eVhGL+9abGHkZtVoTs+dvrWkI5g00lyMaAxRIK+rqXGt"
    crossorigin="anonymous"></script>
  <!-- KaTeX CSS & JS with auto-render for robust native math typography -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css"
    integrity="sha384-GvrOXuhMATgEsSwCs4smul74iXGOixntILdUW9XmUC6+HX0sLNAK3q71HotJqlAn"
    crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"
    integrity="sha384-cpW21h6RZv/phavutF+AuVYrr+dA8xD9zs6FwLpaCct6O9ctzYFfFr4dgmgccOTx"
    crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"
    integrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbxyPt0Koah1uHoK0o4+/RRE05"
    crossorigin="anonymous"
    onload="window.renderMathInElement && window.renderMathInElement(document.body, { delimiters: [{left: '$$', right: '$$', display: true}, {left: '\\[', right: '\\]', display: true}, {left: '\\(', right: '\\)', display: false}, {left: '$', right: '$', display: false}], throwOnError: false })"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <style>
    .simulator-ui .text-xs {
      font-size: 0.8125rem;
      line-height: 1.2rem;
    }
    .simulator-ui [class~="text-[10px]"],
    .simulator-ui [class~="text-[11px]"] {
      font-size: 0.75rem;
      line-height: 1rem;
    }
    .simulator-ui [class~="rounded-2xl"][class~="border"] {
      border-color: #dbe3ef;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 8px 24px rgba(15, 23, 42, 0.035);
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }
    .simulator-ui input:not([type="range"]):not([type="checkbox"]):not([type="radio"]):not([type="file"]):not([type="hidden"]),
    .simulator-ui select,
    .simulator-ui textarea {
      min-height: 2.5rem;
      font-size: 0.875rem;
      line-height: 1.25rem;
    }
    .simulator-ui button {
      min-height: 2.25rem;
    }
    .simulator-ui [id^="tab-"],
    .simulator-ui .preset-btn {
      flex-shrink: 0;
      min-height: 2.5rem;
      white-space: nowrap;
    }
    .simulator-ui input[type="range"] {
      min-height: 2.5rem;
      touch-action: pan-y;
    }
    .simulator-ui :focus-visible {
      outline: 3px solid #818cf8;
      outline-offset: 2px;
    }
    .simulator-ui input[type="range"]:focus-visible {
      outline-offset: 4px;
    }
    .simulator-ui th,
    .simulator-ui td {
      white-space: nowrap;
    }

    /* Custom Slider Styles */
    input[type=range] {
      -webkit-appearance: none;
      background: #e2e8f0;
      border-radius: 9999px;
      height: 8px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 20px;
      width: 20px;
      border-radius: 50%;
      background: #4f46e5;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(79, 70, 229, 0.4);
      border: 2px solid #ffffff;
      transition: transform 0.1s ease;
    }
    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }
    /* Dual-range slider (two overlapping handles) */
    input[type=range].dual-range {
      background: transparent;
      height: 24px;
      pointer-events: none;
    }
    input[type=range].dual-range::-webkit-slider-thumb {
      pointer-events: auto;
    }
    input[type=range].dual-range.dual-t1::-webkit-slider-thumb {
      background: #d97706;
    }
    input[type=range].dual-range.dual-t2::-webkit-slider-thumb {
      background: #ea580c;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 9999px;
    }
  </style>
</head>
